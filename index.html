    <title>The Last Phantom Z - Game by Kevin Lo</title>

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;      
        background: #000;      
      }

  <body>
    <div id="app"></div>
    <div id="mobile-controls" style="display:none; position:fixed; bottom:0; left:0; width:100%; height:100%; pointer-events:none;">
    <!-- Joystick -->
    <div id="joystick-base"
      style="
        position:absolute;
        width:130px;
        height:130px;
        border-radius:50%;
        background:rgba(0,0,0,0.6);
        bottom:30px;
        left:30px;
        pointer-events:auto;
      ">
      <div id="joystick-thumb"
        style="
          position:absolute;
          width:60px;
          height:60px;
          border-radius:50%;
          background:rgba(255,255,255,0.6);
          top:35px;
          left:35px;
        ">
      </div>
    </div>

    <!-- Skill Buttons -->
    <div id="skill-buttons"
      style="
        position:absolute;
        bottom:40px;
        right:10px;   /* moved more right */
        width:200px;
        height:200px;
        pointer-events:auto;
      ">

      <!-- Button 1 (LEFT) -->
      <div class="skill-btn" id="btn1"
        style="
          position:absolute;
          top:50%;
          left:0;
          transform:translateY(-50%);
          width:70px;
          height:70px;
          border-radius:50%;
          background:rgba(164, 235, 204, 0.6);
          transition: transform 0.08s ease, filter 0.08s ease;
        ">
      </div>

      <!-- Button 2 (TOP) -->
      <div class="skill-btn" id="btn2"
        style="
          position:absolute;
          top:0;
          left:50%;
          transform:translateX(-50%);
          width:70px;
          height:70px;
          border-radius:50%;
          background:rgba(101, 174, 214, 0.6);
          transition: transform 0.08s ease, filter 0.08s ease;
        ">
      </div>

      <!-- Button 3 (BOTTOM) -->
      <div class="skill-btn" id="btn3"
        style="
          position:absolute;
          bottom:0;
          left:50%;
          transform:translateX(-50%);
          width:70px;
          height:70px;
          border-radius:50%;
          background:rgba(181, 109, 127, 0.6);
          transition: transform 0.08s ease, filter 0.08s ease;
        ">
      </div>

      <!-- Button 4 (RIGHT) -->
      <div class="skill-btn" id="btn4"
        style="
          position:absolute;
          top:50%;
          right:0;
          transform:translateY(-50%);
          width:70px;
          height:70px;
          border-radius:50%;
          background:rgba(240, 179, 141, 0.6);
          transition: transform 0.08s ease, filter 0.08s ease;
        ">
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
