<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Phantomz</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;      
        background: #000;      
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="mobile-controls" style="display:none; position:fixed; bottom:0; left:0; width:100%; height:100%; pointer-events:none;">
      <!-- Joystick -->
      <div id="joystick-base" style="position:absolute; width:180px; height:180px; border-radius:50%; background:rgba(0,0,0,0.3); bottom:30px; left:30px; pointer-events:auto;">
        <div id="joystick-thumb" style="position:absolute; width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.6); top:40px; left:40px;"></div>
      </div>

      <!-- Skill Buttons -->
      <div id="skill-buttons" style="position:absolute; bottom:30px; right:30px; pointer-events:auto;">
        <div class="skill-btn" style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.4); margin:0 10px;"></div>
        <div class="skill-btn" style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.4); margin:0 10px;"></div>
        <div class="skill-btn" style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.4); margin:0 10px;"></div>
        <div class="skill-btn" style="width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.4); margin:0 10px;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
